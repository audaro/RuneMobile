name: GpuB1
options:
  bundleIdPrefix: dev.audaro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GpuB1:
    type: application
    platform: iOS
    sources:
      - path: app
      - path: assembled
        buildPhase: resources
        # the four real Template-assembled gpu-plugin shaders (#version 330) — bundled flat, downported at runtime
    dependencies:
      - sdk: OpenGLES.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.audaro.gpub1
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CLANG_ENABLE_OBJC_ARC: "YES"
