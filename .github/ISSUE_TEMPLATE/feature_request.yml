name: Feature request
description: Suggest an enhancement to the mobile client.
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Does this touch the shared engine bridge (headless/*)?
      description: If unsure, choose "Not sure" — changes there affect both ports.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
    validations:
      required: false
