name: CI

# Upstream RuneLite's full build/test (JDK 11). We keep it available for manual runs but do NOT let it fire on
# every push/PR: this fork enables Actions only to drive the self-hosted runemobile-release workflow, and this
# heavy hosted-runner job would otherwise consume minutes on every merge. (Re-widen the trigger if you ever
# want upstream CI back.) Kept as workflow_dispatch so a future upstream merge conflicts loudly here, on purpose.
on: [ workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      # Actions pinned to full commit SHAs (not mutable tags) so a retagged action can't run new code here.
      - name: Cache glslang
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: wrapper

      - name: Build and Test
        run: ./ci/build.sh
