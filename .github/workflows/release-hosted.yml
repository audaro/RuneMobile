# RuneMobile rolling release — FULLY HOSTED on GitHub (no self-hosted Mac, no private repo).
#
# Builds a release APK + an ad-hoc-signed IPA on a GitHub-hosted macOS runner and publishes them as a rolling
# prerelease on THIS repo. The APK is release-signed with the 45:E3 key (it installs directly). The IPA is
# ad-hoc-signed only — AltStore/SideStore re-sign it on-device at install, the only supported way to run it, so
# CI needs no Apple cert/profile/team. It reuses the tested build/publish scripts (tools/ci/*.sh) verbatim; the
# only new work is providing their two inputs (Android keystore + iOS JRE) from a GitHub secret + a release
# asset instead of the developer Mac's ~/.runemobile-ci.
#
# ── STATUS: DRAFT ────────────────────────────────────────────────────────────────────────────────────────
# Manual-trigger ONLY (workflow_dispatch) until proven, so it can't fail noisily before the secrets exist.
# Once a manual run produces a release APK + an installable IPA, flip the trigger to `push: branches: [master]` and this
# becomes the "every merge to master rebuilds + releases both apps" pipeline.
#
# ── REQUIRED SETUP (one-time, done by the repo owner — run tools/ci/setup-hosted-secrets.sh) ─────────────
# Only ANDROID needs real signing material — the APK installs directly, so it must carry the release key. The
# IPA is ad-hoc-signed and re-signed on-device by AltStore/SideStore, so NO Apple cert/profile is uploaded.
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64        base64 of the release .jks
#   ANDROID_KEYSTORE_PROPERTIES keystore.properties minus storeFile (this workflow pins storeFile itself)
# Release asset (the iOS JRE, ~166 MB, not URL-reproducible), uploaded by the same helper:
#   gh release create ios-jre-dep <jre.tar.gz> --repo <owner>/<repo> --prerelease
#   (Publishing an OpenJDK build is fine — GPLv2+CE, and it already ships inside every IPA.)

name: release-hosted

on:
  workflow_dispatch:
  # TODO(flip once proven): uncomment to make every merge to master rebuild + release both apps.
  # push:
  #   branches: [master]

concurrency:
  group: release-hosted
  cancel-in-progress: true

jobs:
  build-and-publish:
    # Runs only on the canonical public repo (id 1296635776) AND only against master — so a workflow_dispatch
    # (or later push) on any other branch can't run untrusted code with the production signing secrets. Inert
    # in forks; fork PRs never receive secrets regardless — this is defense in depth. (Optional further
    # hardening: bind this job to a `production` deployment environment whose deployment branch is master.)
    if: github.repository_id == '1296635776' && github.ref == 'refs/heads/master'
    runs-on: macos-14
    permissions:
      contents: write   # publish the rolling release to THIS repo (no PUBLISH_TOKEN needed anymore)
    env:
      # Offset past the retiring self-hosted pipeline's run count (~10s) so hosted builds are always strictly
      # newer: Android versionCode = 1_000_000 + BUILD_NUMBER must never regress across the self-hosted→hosted
      # cutover. github.run_number restarts at 1 for this new workflow file, hence the offset.
      BUILD_NUMBER: ${{ github.run_number + 1000 }}
      GIT_SHA: ${{ github.sha }}
      REQUIRE_RELEASE_KEY: "1"           # refuse to publish an APK not signed by the real release key
      IOS_ADHOC: "1"                     # ad-hoc-sign the IPA — AltStore/SideStore re-signs it on-device
      CI_CONFIG_DIR: ${{ runner.temp }}/runemobile-ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      # setup-java exports JAVA_HOME for the whole job; the build scripts read $JAVA_HOME.

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Contract pre-flight (fast, non-bypassable)
        run: ./android/dev-tools/ci/release-gate.sh --contract-only

      - name: Materialize Android signing from secrets  (nothing here is echoed)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_CONFIG_DIR"
          # Android is the only real signer: the APK installs directly (no re-signer), so it needs the release
          # key. Write passwords/alias from the secret, decode the keystore, and pin storeFile to the runner's
          # absolute path (appended last so it wins over any stale storeFile the secret may carry).
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > "$CI_CONFIG_DIR/keystore.properties"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.jks"
          printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/android/app/release.jks" >> "$CI_CONFIG_DIR/keystore.properties"
          # iOS needs NO signing material here — IOS_ADHOC=1 ad-hoc-signs, and AltStore/SideStore re-signs the
          # IPA on-device at install (the only supported way to run it).

      - name: Fetch the iOS JRE build dependency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_CONFIG_DIR/ios-jre"
          gh release download ios-jre-dep --repo "$GITHUB_REPOSITORY" --pattern 'jre.tar.gz' --output "$RUNNER_TEMP/jre.tar.gz"
          tar xzf "$RUNNER_TEMP/jre.tar.gz" -C "$CI_CONFIG_DIR/ios-jre" --strip-components=1

      - name: Build release APK + ad-hoc IPA
        run: |
          export GIT_SHA="$(git rev-parse --short "${GIT_SHA}")"
          tools/ci/build-release-artifacts.sh

      - name: Publish rolling prerelease to this repo
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # same-repo publish — the built-in token suffices
        run: |
          export GIT_SHA="$(git rev-parse --short HEAD)"
          tools/ci/publish-rolling-release.sh
